<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Me X GOAT</title>
<link rel="stylesheet" href="/static/vendor/cm-chessboard/assets/chessboard.css">
<link rel="stylesheet" href="/static/vendor/cm-chessboard/assets/extensions/promotion-dialog/promotion-dialog.css">
<link rel="stylesheet" href="/static/styles/base.css">
<!-- Every theme file loads unconditionally; body's theme-* class picks
     which one actually paints anything, so no JS ever branches on the
     current theme. Adding a theme means adding a file here and an
     option below, nothing else. -->
<link rel="stylesheet" href="/static/styles/wood.css">
<link rel="stylesheet" href="/static/styles/classic-green.css">
<link rel="stylesheet" href="/static/styles/blue.css">
<link rel="stylesheet" href="/static/styles/marble.css">
<link rel="stylesheet" href="/static/styles/high-contrast.css">
</head>
<body>
<h1>Me X GOAT</h1>

<div id="new-game-panel">
  <div>
    <span>Play as:</span>
    <button type="button" data-color="white">White</button>
    <button type="button" data-color="black">Black</button>
    <button type="button" data-color="random">Random</button>
  </div>
  <div>
    <label for="strength-input">Strength:</label>
    <input type="range" id="strength-input" min="800" max="2800" step="100" value="1400">
    <span id="strength-value">1400</span>
  </div>
  <div>
    <label for="style-input">Style:</label>
    <select id="style-input">
      <option value="carlsen">Carlsen</option>
      <option value="raw">Raw engine</option>
    </select>
  </div>
  <div>
    <label for="theme-input">Theme:</label>
    <select id="theme-input">
      <option value="wood">Wood</option>
      <option value="classic-green">Classic green</option>
      <option value="blue">Blue</option>
      <option value="marble">Marble</option>
      <option value="high-contrast">High contrast</option>
    </select>
  </div>
</div>

<div id="board"></div>

<div id="controls">
  <button type="button" id="take-back-button" disabled>Take back</button>
  <button type="button" id="export-pgn-button" disabled>Export PGN</button>
</div>

<div id="status"></div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
