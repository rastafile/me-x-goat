<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Me X GOAT</title>
<link rel="stylesheet" href="/static/vendor/cm-chessboard/assets/chessboard.css">
<link rel="stylesheet" href="/static/vendor/cm-chessboard/assets/extensions/promotion-dialog/promotion-dialog.css">
<link rel="stylesheet" href="/static/styles/base.css">
<!-- Every theme file loads unconditionally; body's theme-* class picks
     which one actually paints anything, so no JS ever branches on the
     current theme. Adding a theme means adding a file here and an
     option below, nothing else. -->
<link rel="stylesheet" href="/static/styles/wood.css">
<link rel="stylesheet" href="/static/styles/classic-green.css">
<link rel="stylesheet" href="/static/styles/blue.css">
<link rel="stylesheet" href="/static/styles/marble.css">
<link rel="stylesheet" href="/static/styles/high-contrast.css">
</head>
<body>
<h1>Me X GOAT</h1>

<div id="new-game-panel">
  <div>
    <span data-i18n="playAs">Play as:</span>
    <button type="button" data-color="white" data-i18n="white">White</button>
    <button type="button" data-color="black" data-i18n="black">Black</button>
    <button type="button" data-color="random" data-i18n="random">Random</button>
  </div>
  <div>
    <label for="strength-input" data-i18n="strength">Strength:</label>
    <input type="range" id="strength-input" min="800" max="2800" step="100" value="1400">
    <span id="strength-value">1400</span>
  </div>
  <div>
    <label for="style-input" data-i18n="style">Style:</label>
    <select id="style-input">
      <option value="carlsen" data-i18n="styleCarlsen">Carlsen</option>
      <option value="raw" data-i18n="styleRaw">Raw engine</option>
    </select>
  </div>
  <div>
    <label for="theme-input" data-i18n="theme">Theme:</label>
    <select id="theme-input">
      <option value="wood" data-i18n="themeWood">Wood</option>
      <option value="classic-green" data-i18n="themeClassicGreen">Classic green</option>
      <option value="blue" data-i18n="themeBlue">Blue</option>
      <option value="marble" data-i18n="themeMarble">Marble</option>
      <option value="high-contrast" data-i18n="themeHighContrast">High contrast</option>
    </select>
  </div>
  <div>
    <label for="language-input" data-i18n="language">Language:</label>
    <!-- Each language names itself, not translated by the switch itself --
         the same convention every language picker follows. -->
    <select id="language-input">
      <option value="en-US">English</option>
      <option value="pt-BR">Português (Brasil)</option>
    </select>
  </div>
  <div>
    <label for="mate-badge-toggle">
      <input type="checkbox" id="mate-badge-toggle" checked>
      <span data-i18n="mateBadgeToggle">Mate badge</span>
    </label>
  </div>
  <div>
    <label for="eval-bar-toggle">
      <input type="checkbox" id="eval-bar-toggle" checked>
      <span data-i18n="evalBarToggle">Evaluation bar</span>
    </label>
  </div>
</div>

<!-- design.md §7: announces mate's existence and distance only, never the
     piece, square, or move. Empty (and hidden, see base.css) whenever
     there's nothing to announce or the switch above is off. -->
<div id="mate-badge"></div>

<div id="board-row">
  <!-- design.md §8: "Evaluation bar on the side, with a hide option."
       Fill grows from the bottom -- the user's own pieces are always at
       the bottom of the board too (orientation follows their color), so
       the bar's "up" matches the board's. -->
  <div id="eval-bar">
    <div id="eval-bar-fill"></div>
  </div>
  <div id="board"></div>
</div>

<!-- design.md §5: persistent, rewritten only on a structural transition --
     a third voice/area, distinct from both the GOAT's (#status) and the
     tutor's (#tutor-panel). Empty until the first transition fires. -->
<div id="game-plan-panel"></div>

<div id="controls">
  <button type="button" id="take-back-button" data-i18n="takeBack" disabled>Take back</button>
  <button type="button" id="export-pgn-button" data-i18n="exportPgn" disabled>Export PGN</button>
</div>

<div id="status"></div>

<!-- Visually distinct from #status (the GOAT's own voice) per design.md
     §8: "Tutor panel and GOAT panel visually distinct -- two voices, two
     places." Populated only after the user's own moves. -->
<div id="tutor-panel"></div>

<div id="mistake-panel"></div>

<div id="summary-panel"></div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
